<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Great Liu's Challenge</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,400&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Playfair Display', Georgia, serif;
      background-color: #FAF7F2;
      color: #1C3A27;
    }
    .font-sans { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif { font-family: 'Playfair Display', Georgia, serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React Application Code -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Official Liu's Cafe Menu Items
    const LIUS_MENU = [
      "Kaya Jam Toast",
      "Chiayi Chicken Rice",
      "Braised Pork Belly Rice",
      "Spicy Wontons",
      "Sesame Cold Noodle w/ Chili Crisp",
      "Sesame Cold Noodle + Hand-Peeled Chicken",
      "Beef Noodle Soup",
      "Hong Kong Style French Toast"
    ];

    // Helper: Calculate live countdown until Dec 13th
    function calculateDaysLeft() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let targetDate = new Date(targetYear, 11, 13, 23, 59, 59); // Dec 13th 11:59:59 PM

      if (now > targetDate) {
        targetDate = new Date(targetYear + 1, 11, 13, 23, 59, 59);
      }

      const diffMs = targetDate - now;
      if (diffMs <= 0) return { days: 0, hours: 0, mins: 0, isOver: true };

      const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

      return { days, hours, mins, isOver: false };
    }

    // Inline SVG Icon Helpers
    const Icon = {
      Trophy: ({className="w-4 h-4"}) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M8 21h8m-4-4v4m-5-9a4 4 0 01-4-4V5h14v3a4 4 0 01-4 4M5 5H3a2 2 0 00-2 2v1a4 4 0 004 4h1m12-7h2a2 2 0 012 2v1a4 4 0 01-4 4h-1"/></svg>
      ),
      Crown: ({className="w-4 h-4"}) => (
        <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
      ),
      Plus: ({className="w-4 h-4"}) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>
      ),
      Camera: ({className="w-4 h-4"}) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path strokeLinecap="round" strokeLinejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      ),
      Clock: ({className="w-4 h-4"}) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      ),
      Lock: ({className="w-4 h-4"}) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      ),
      Edit: ({className="w-4 h-4"}) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
      ),
      Trash: ({className="w-4 h-4"}) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      ),
      Flame: ({className="w-4 h-4"}) => (
        <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M12 23c-4.97 0-9-3.58-9-8 0-4.19 3.02-7.58 6.55-10.45.6-.49 1.45.02 1.34.79-.31 2.1.84 3.66 2.11 3.66 1.48 0 2.22-1.39 1.8-2.82-.24-.82.16-1.68.91-2.01C18.66 2.88 21 7.21 21 12c0 6.08-4.03 11-9 11z"/></svg>
      ),
      Zap: ({className="w-4 h-4"}) => (
        <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      ),
      Award: ({className="w-4 h-4"}) => (
        <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M12 2a6 6 0 00-6 6c0 2.22 1.21 4.15 3 5.19V22l3-2 3 2v-8.81c1.79-1.04 3-2.97 3-5.19a6 6 0 00-6-6z"/></svg>
      ),
      X: ({className="w-4 h-4"}) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      ),
      AlertCircle: ({className="w-4 h-4"}) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      )
    };

    // Metallic Medal Graphic Component
    function MedalGraphic({ rank, className = "w-16 h-20" }) {
      const config = {
        1: { c1: "#FFE57F", c2: "#FFB300", c3: "#FF6F00", stroke: "#8F5200", num: "1" },
        2: { c1: "#FFFFFF", c2: "#E0E0E0", c3: "#9E9E9E", stroke: "#546E7A", num: "2" },
        3: { c1: "#FFCC80", c2: "#D7CCC8", c3: "#A1887F", stroke: "#4E342E", num: "3" }
      }[rank] || { c1: "#FFE57F", c2: "#FFB300", c3: "#FF6F00", stroke: "#8F5200", num: "1" };

      return (
        <svg viewBox="0 0 100 120" className={className} xmlns="http://www.w3.org/2000/svg">
          <path d="M 30 60 L 12 112 L 28 104 L 42 112 L 38 60 Z" fill="#C62828" />
          <path d="M 62 60 L 58 112 L 72 104 L 88 112 L 70 60 Z" fill="#C62828" />
          <circle cx="50" cy="45" r="40" fill={config.c2} stroke={config.stroke} strokeWidth="2" />
          <circle cx="50" cy="45" r="32" fill={config.c1} stroke={config.stroke} strokeWidth="1.5" />
          <text x="50" y="55" textAnchor="middle" fontFamily="sans-serif" fontWeight="900" fontSize="28" fill={config.stroke}>
            {config.num}
          </text>
        </svg>
      );
    }

    function App() {
      const [visits, setVisits] = useState([]);
      const [activeTab, setActiveTab] = useState('leaderboard');
      const [isTrackModalOpen, setIsTrackModalOpen] = useState(false);
      const [isAdmin, setIsAdmin] = useState(false);
      const [isAdminModalOpen, setIsAdminModalOpen] = useState(false);
      const [passcode, setPasscode] = useState('');
      const [passError, setPassError] = useState('');
      const [selectedMember, setSelectedMember] = useState(null);

      const [timeLeft, setTimeLeft] = useState(calculateDaysLeft);

      // Form States
      const [hostName, setHostName] = useState('');
      const [guestName, setGuestName] = useState('');
      const [selectedFood, setSelectedFood] = useState(LIUS_MENU[0]);
      const [guestFood, setGuestFood] = useState(LIUS_MENU[0]);
      const [photoBase64, setPhotoBase64] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      // Admin Edit States
      const [editingVisit, setEditingVisit] = useState(null);
      const [editHost, setEditHost] = useState('');
      const [editGuest, setEditGuest] = useState('');
      const [editFood, setEditFood] = useState(LIUS_MENU[0]);
      const [editPhoto, setEditPhoto] = useState('');
      const [editDate, setEditDate] = useState('');
      const [editError, setEditError] = useState('');

      // Countdown Timer Hook
      useEffect(() => {
        const timer = setInterval(() => setTimeLeft(calculateDaysLeft()), 30000);
        return () => clearInterval(timer);
      }, []);

      // Load visits from local browser storage on start
      useEffect(() => {
        try {
          const saved = localStorage.getItem('lius_challenge_visits');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setVisits(parsed);
            }
          }
        } catch (e) {
          console.warn("Local storage cache read error", e);
        }
      }, []);

      // Backup local storage write
      useEffect(() => {
        try {
          localStorage.setItem('lius_challenge_visits', JSON.stringify(visits));
        } catch (e) {
          console.warn("Local storage write error", e);
        }
      }, [visits]);

      // Ultra-fast Image Compressor
      const compressAndSetPhoto = (file, callback) => {
        if (file.size > 20 * 1024 * 1024) {
          setErrorMsg("File size exceeds 20MB limit.");
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxDim = 600;
            if (width > maxDim || height > maxDim) {
              if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
              else { width = Math.round((width * maxDim) / height); height = maxDim; }
            }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            callback(canvas.toDataURL('image/jpeg', 0.5));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      };

      // Track New Visit Entry
      const handleTrackVisit = (e) => {
        e.preventDefault();
        const cleanHost = hostName.trim();
        const cleanGuest = guestName.trim();

        if (!cleanHost || !cleanGuest) {
          setErrorMsg("Please enter both Host and Guest names.");
          return;
        }
        if (cleanHost.toLowerCase() === cleanGuest.toLowerCase()) {
          setErrorMsg("Host and Guest cannot be the same person.");
          return;
        }

        // Rule #3 Check: Host cannot bring the exact same guest twice
        const isDup = visits.some(
          v => v.hostName?.toLowerCase() === cleanHost.toLowerCase() &&
               v.guestName?.toLowerCase() === cleanGuest.toLowerCase()
        );

        if (isDup) {
          setErrorMsg(`⛔ REJECTED: ${cleanHost} has already brought ${cleanGuest}! Rule #3 states you cannot count the same person twice.`);
          return;
        }

        const timestampStr = new Date().toLocaleDateString('en-US', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        const now = Date.now();
        const groupId = `grp_${now}_${Math.random().toString(36).substring(2, 6)}`;

        const entry1 = {
          id: `vis_1_${now}`,
          groupId,
          hostName: cleanHost,
          guestName: cleanGuest,
          foodOrdered: selectedFood,
          photo: photoBase64 || null,
          timestamp: timestampStr,
          createdAt: now
        };

        const entry2 = {
          id: `vis_2_${now}`,
          groupId,
          hostName: cleanGuest,
          guestName: cleanHost,
          foodOrdered: guestFood,
          photo: photoBase64 || null,
          timestamp: timestampStr,
          createdAt: now
        };

        setVisits(prev => [entry1, entry2, ...prev]);

        setHostName('');
        setGuestName('');
        setSelectedFood(LIUS_MENU[0]);
        setGuestFood(LIUS_MENU[0]);
        setPhotoBase64('');
        setErrorMsg('');
        setIsTrackModalOpen(false);
      };

      // Instant Delete Entry (removes host & guest reciprocal records and photos)
      const handleDeleteVisit = (id) => {
        if (!id) return;
        const cleanId = String(id).startsWith('joint_') ? String(id).replace('joint_', '') : String(id);
        const target = visits.find(v => String(v.id) === cleanId);
        if (!target) return;

        const itemsToDelete = visits.filter(v => 
          v.id === target.id || 
          (target.groupId && v.groupId === target.groupId) ||
          (v.hostName === target.guestName && v.guestName === target.hostName && v.createdAt === target.createdAt)
        );

        const targetIds = itemsToDelete.map(i => i.id);
        setVisits(prev => prev.filter(v => !targetIds.includes(v.id)));
        setEditingVisit(null);
      };

      // Admin Auth
      const handleAdminAuth = (e) => {
        e.preventDefault();
        if (passcode.trim() === "bvislius") {
          setIsAdmin(true);
          setIsAdminModalOpen(false);
          setPasscode('');
          setPassError('');
        } else {
          setPassError("Incorrect admin code! (bvislius)");
        }
      };

      // Open Edit Modal
      const handleOpenEdit = (v) => {
        setEditingVisit(v);
        setEditHost(v.hostName || '');
        setEditGuest(v.guestName || '');
        setEditFood(v.foodOrdered || LIUS_MENU[0]);
        setEditPhoto(v.photo || '');

        const d = v.createdAt ? new Date(v.createdAt) : new Date();
        setEditDate(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
        setEditError('');
      };

      // Save Admin Edits
      const handleSaveEdit = (e) => {
        e.preventDefault();
        if (!editingVisit) return;
        const cleanHost = editHost.trim();
        const cleanGuest = editGuest.trim();
        if (!cleanHost || !cleanGuest) {
          setEditError("Both Host and Guest names are required.");
          return;
        }

        let newCreatedAt = editingVisit.createdAt || Date.now();
        let newTimestampStr = editingVisit.timestamp;
        if (editDate) {
          const parts = editDate.split('-');
          if (parts.length === 3) {
            const d = new Date();
            d.setFullYear(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
            newCreatedAt = d.getTime();
            newTimestampStr = d.toLocaleDateString('en-US', {
              month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
          }
        }

        const itemsToUpdate = visits.filter(v => 
          v.id === editingVisit.id || 
          (editingVisit.groupId && v.groupId === editingVisit.groupId)
        );

        setVisits(prev => prev.map(v => {
          const isTarget = v.id === editingVisit.id;
          const isPartner = itemsToUpdate.some(i => i.id === v.id);
          if (isPartner) {
            return {
              ...v,
              hostName: isTarget ? cleanHost : cleanGuest,
              guestName: isTarget ? cleanGuest : cleanHost,
              foodOrdered: isTarget ? editFood : v.foodOrdered,
              photo: editPhoto || null,
              createdAt: newCreatedAt,
              timestamp: newTimestampStr
            };
          }
          return v;
        }));

        setEditingVisit(null);
      };

      // Calculate Leaderboard Rankings & Bonus Points
      const leaderboardData = useMemo(() => {
        const map = {};
        visits.forEach(v => {
          const host = v.hostName;
          if (!host) return;
          if (!map[host]) {
            map[host] = { name: host, visitsLogged: 0, guestsBrought: [], foodCounts: {}, photos: [], visitDates: [] };
          }

          const stat = map[host];
          stat.visitsLogged += 1;
          stat.guestsBrought.push(v.guestName);

          const d = v.createdAt ? new Date(v.createdAt) : new Date();
          const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          stat.visitDates.push(dateStr);

          if (v.foodOrdered) stat.foodCounts[v.foodOrdered] = (stat.foodCounts[v.foodOrdered] || 0) + 1;
          if (v.photo) stat.photos.push({ url: v.photo, guest: v.guestName, food: v.foodOrdered, timestamp: v.timestamp });
        });

        const list = Object.values(map).map(item => {
          const dateCounts = {};
          item.visitDates.forEach(d => { dateCounts[d] = (dateCounts[d] || 0) + 1; });
          const twiceInDayBonus = Object.values(dateCounts).filter(c => c >= 2).length;

          const uniqueSortedDates = Object.keys(dateCounts).sort();
          let streakBonus = 0;
          let currentRun = 1;
          for (let i = 1; i < uniqueSortedDates.length; i++) {
            const diffDays = Math.round((new Date(uniqueSortedDates[i]) - new Date(uniqueSortedDates[i-1])) / (1000 * 60 * 60 * 24));
            if (diffDays === 1) {
              currentRun++;
              if (currentRun >= 3) streakBonus += 1;
            } else if (diffDays > 1) {
              currentRun = 1;
            }
          }

          const uniqueFoodsCount = Object.keys(item.foodCounts).length;
          const menuCompletionBonus = uniqueFoodsCount >= LIUS_MENU.length ? 2 : 0;
          const totalPoints = item.visitsLogged + twiceInDayBonus + streakBonus + menuCompletionBonus;

          return { ...item, uniqueFoodsCount, twiceInDayBonus, streakBonus, menuCompletionBonus, totalPoints };
        });

        list.sort((a, b) => b.totalPoints - a.totalPoints || b.uniqueFoodsCount - a.uniqueFoodsCount || b.visitsLogged - a.visitsLogged);
        list.forEach((item, index) => { item.rank = index + 1; });
        return list;
      }, [visits]);

      const top1 = leaderboardData[0];
      const top2 = leaderboardData[1];
      const top3 = leaderboardData[2];

      const allPhotos = useMemo(() => {
        return visits.filter(v => v.photo).map(v => ({
          id: v.id,
          photo: v.photo,
          person1: v.hostName,
          person2: v.guestName,
          food1: v.foodOrdered,
          timestamp: v.timestamp
        }));
      }, [visits]);

      return (
        <div className="min-h-screen bg-[#FAF7F2] text-[#1C3A27] pb-16">
          <div className="max-w-4xl mx-auto px-4 pt-6">

            <div className="border-2 border-[#1C3A27] p-4 sm:p-8 bg-[#FAF7F2] shadow-xl rounded-sm">
              <div className="border border-[#1C3A27]/50 p-4 sm:p-6">

                {/* HEADER */}
                <header className="relative text-center mb-8 pb-6 border-b-2 border-[#1C3A27]/30">
                  
                  {/* Top Left Countdown Badge */}
                  <div className="absolute top-0 left-0 font-sans flex flex-col gap-1 items-start">
                    <div className="flex items-center gap-1.5 bg-[#1C3A27] text-amber-400 text-[10px] sm:text-xs font-bold px-2.5 py-1 rounded-sm border border-amber-400/40">
                      <Icon.Clock className="w-3.5 h-3.5 text-amber-400" />
                      <span>{timeLeft.isOver ? "Challenge Complete!" : `${timeLeft.days}D ${timeLeft.hours}H LEFT`}</span>
                    </div>
                  </div>

                  {/* Top Right Admin Lock Button */}
                  <div className="absolute top-0 right-0 font-sans">
                    {isAdmin ? (
                      <button onClick={() => setIsAdmin(false)} className="bg-[#1C3A27] text-amber-400 text-[10px] font-bold px-2 py-1 rounded-sm">ADMIN ACTIVE (LOCK)</button>
                    ) : (
                      <button onClick={() => setIsAdminModalOpen(true)} className="p-1.5 text-[#1C3A27]/40 hover:text-[#1C3A27]"><Icon.Lock className="w-4 h-4" /></button>
                    )}
                  </div>

                  <div className="tracking-widest font-sans font-black text-xs uppercase mb-1 pt-6 sm:pt-0">BRUIN VENTURES</div>
                  <h1 className="text-3xl sm:text-5xl font-black font-serif leading-none py-1">The Great Liu's Challenge</h1>
                </header>

                {/* TABS NAVIGATION */}
                <div className="flex justify-center gap-3 mb-6 font-sans">
                  <button onClick={() => setActiveTab('leaderboard')} className={`px-4 py-2 font-bold text-xs uppercase rounded-sm border border-[#1C3A27] ${activeTab === 'leaderboard' ? 'bg-[#1C3A27] text-white' : 'bg-white'}`}>Leaderboard</button>
                  <button onClick={() => setActiveTab('album')} className={`px-4 py-2 font-bold text-xs uppercase rounded-sm border border-[#1C3A27] ${activeTab === 'album' ? 'bg-[#1C3A27] text-white' : 'bg-white'}`}>Photo Gallery ({allPhotos.length})</button>
                  {isAdmin && <button onClick={() => setActiveTab('admin')} className={`px-4 py-2 font-bold text-xs uppercase rounded-sm border border-amber-600 ${activeTab === 'admin' ? 'bg-amber-600 text-white' : 'bg-amber-50 text-amber-900'}`}>Manage</button>}
                </div>

                {/* MAIN ACTION BUTTON */}
                <div className="flex justify-center mb-8 font-sans">
                  <button onClick={() => setIsTrackModalOpen(true)} className="px-6 py-3 bg-[#1C3A27] text-white font-black text-xs uppercase tracking-wider flex items-center gap-2 rounded-sm shadow-md hover:bg-[#12271A]">
                    <Icon.Plus className="w-4 h-4 text-amber-400" /> Track Liu's Visit
                  </button>
                </div>

                {/* LEADERBOARD TAB */}
                {activeTab === 'leaderboard' && (
                  <div>
                    {/* BONUS BADGES */}
                    <div className="mb-6 font-sans bg-[#1C3A27]/5 border border-[#1C3A27]/20 p-3 rounded-sm grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
                      <div className="bg-white p-2 rounded-sm border flex items-center gap-2"><Icon.Flame className="w-4 h-4 text-orange-500" /><span><strong>+1 Pt:</strong> 3 Days Streak</span></div>
                      <div className="bg-white p-2 rounded-sm border flex items-center gap-2"><Icon.Zap className="w-4 h-4 text-amber-500" /><span><strong>+1 Pt:</strong> Twice in a Day</span></div>
                      <div className="bg-white p-2 rounded-sm border flex items-center gap-2"><Icon.Award className="w-4 h-4 text-emerald-600" /><span><strong>+2 Pts:</strong> Full Menu</span></div>
                    </div>

                    {/* PODIUM */}
                    <div className="grid grid-cols-3 gap-2 sm:gap-4 items-end max-w-xl mx-auto mb-8 font-sans text-center">
                      <div>
                        {top2 && <div onClick={() => setSelectedMember(top2)} className="cursor-pointer mb-1 text-xs font-bold truncate">{top2.name}<div className="text-[10px] text-[#1C3A27]/70">{top2.totalPoints} pts</div></div>}
                        <div className="bg-[#E5E0D8] h-24 rounded-t-xs flex items-center justify-center border-t-2 border-[#1C3A27]"><MedalGraphic rank={2} className="w-12 h-14" /></div>
                      </div>
                      <div>
                        {top1 && <div onClick={() => setSelectedMember(top1)} className="cursor-pointer mb-1 text-xs font-extrabold text-amber-600 truncate"><Icon.Crown className="w-4 h-4 mx-auto mb-0.5 text-amber-500" />{top1.name}<div className="text-[10px] text-[#1C3A27]">{top1.totalPoints} pts</div></div>}
                        <div className="bg-amber-400/20 h-32 rounded-t-xs flex items-center justify-center border-t-2 border-amber-500"><MedalGraphic rank={1} className="w-14 h-16" /></div>
                      </div>
                      <div>
                        {top3 && <div onClick={() => setSelectedMember(top3)} className="cursor-pointer mb-1 text-xs font-bold truncate">{top3.name}<div className="text-[10px] text-[#1C3A27]/70">{top3.totalPoints} pts</div></div>}
                        <div className="bg-amber-900/10 h-20 rounded-t-xs flex items-center justify-center border-t-2 border-amber-900"><MedalGraphic rank={3} className="w-10 h-12" /></div>
                      </div>
                    </div>

                    {/* RANKINGS TABLE */}
                    <div className="bg-white rounded-sm border border-[#1C3A27] divide-y font-sans">
                      {leaderboardData.length === 0 ? (
                        <div className="p-8 text-center text-[#1C3A27]/50 italic font-serif">
                          No visits logged yet! Click "Track Liu's Visit" to start the challenge.
                        </div>
                      ) : (
                        leaderboardData.map((member) => (
                          <div key={member.name} onClick={() => setSelectedMember(member)} className="p-3.5 hover:bg-[#1C3A27]/5 cursor-pointer flex justify-between items-center text-xs">
                            <div className="flex items-center gap-3">
                              <span className="font-bold text-xs text-[#1C3A27]/60 w-8">#{member.rank}</span>
                              <div>
                                <div className="font-bold text-sm text-[#1C3A27] flex items-center gap-1.5 flex-wrap">
                                  {member.name}
                                  {member.streakBonus > 0 && <span className="bg-orange-100 text-orange-800 text-[9px] font-bold px-1.5 py-0.5 rounded-full flex items-center gap-0.5"><Icon.Flame className="w-3 h-3 text-orange-500" />+{member.streakBonus}</span>}
                                  {member.twiceInDayBonus > 0 && <span className="bg-amber-100 text-amber-800 text-[9px] font-bold px-1.5 py-0.5 rounded-full flex items-center gap-0.5"><Icon.Zap className="w-3 h-3 text-amber-500" />+{member.twiceInDayBonus}</span>}
                                  {member.menuCompletionBonus > 0 && <span className="bg-emerald-100 text-emerald-800 text-[9px] font-bold px-1.5 py-0.5 rounded-full flex items-center gap-0.5"><Icon.Award className="w-3 h-3 text-emerald-600" />+2</span>}
                                </div>
                                <div className="text-[10px] text-[#1C3A27]/60 font-serif">{member.visitsLogged} visits • {member.uniqueFoodsCount} unique items</div>
                              </div>
                            </div>
                            <span className="font-black text-base text-[#1C3A27] font-mono">{member.totalPoints} pts</span>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}

                {/* PHOTO ALBUM TAB */}
                {activeTab === 'album' && (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 font-sans">
                    {allPhotos.length === 0 ? (
                      <div className="col-span-full p-8 text-center text-[#1C3A27]/50 italic font-serif">
                        No photo uploads yet. Add a photo when tracking a visit!
                      </div>
                    ) : (
                      allPhotos.map((card) => (
                        <div key={card.id} className="bg-white p-2 rounded-sm border border-[#1C3A27]/30">
                          <img src={card.photo} className="w-full h-40 object-cover rounded-xs mb-2" />
                          <div className="text-xs font-bold">{card.person1} & {card.person2}</div>
                          <div className="text-[10px] text-[#1C3A27]/70 font-serif">🍜 {card.food1}</div>
                          {isAdmin && (
                            <div className="mt-2 flex justify-end gap-2">
                              <button onClick={() => handleDeleteVisit(card.id)} className="px-2 py-1 bg-red-100 text-red-700 text-[10px] font-bold rounded-xs">Delete</button>
                            </div>
                          )}
                        </div>
                      ))
                    )}
                  </div>
                )}

                {/* ADMIN MANAGE TAB */}
                {activeTab === 'admin' && isAdmin && (
                  <div className="space-y-2 font-sans text-xs">
                    {visits.map((v) => (
                      <div key={v.id} className="bg-white p-3 rounded-sm border flex justify-between items-center">
                        <div>
                          <strong>{v.hostName}</strong> brought <strong>{v.guestName}</strong>
                          <div className="text-[10px] text-[#1C3A27]/60 font-mono">🍜 {v.foodOrdered} • {v.timestamp}</div>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={() => handleOpenEdit(v)} className="px-2 py-1 bg-[#1C3A27]/10 font-bold rounded-xs">Edit</button>
                          <button onClick={() => handleDeleteVisit(v.id)} className="px-2 py-1 bg-red-100 text-red-700 font-bold rounded-xs">Delete</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

              </div>
            </div>
          </div>

          {/* TRACK VISIT MODAL */}
          {isTrackModalOpen && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 font-sans">
              <div className="bg-[#FAF7F2] border-2 border-[#1C3A27] rounded-sm max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-lg font-serif">Track Liu's Visit</h3>
                  <button onClick={() => setIsTrackModalOpen(false)}><Icon.X className="w-5 h-5" /></button>
                </div>
                {errorMsg && <div className="p-2 bg-red-100 text-red-800 text-xs font-bold">{errorMsg}</div>}
                <form onSubmit={handleTrackVisit} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold mb-1">Your Name (Host):</label>
                    <input type="text" value={hostName} onChange={(e) => setHostName(e.target.value)} className="w-full border p-2 text-sm rounded-xs" placeholder="e.g. Alex Chen" required />
                  </div>
                  <div>
                    <label className="block font-bold mb-1">What Did You Order?</label>
                    <select value={selectedFood} onChange={(e) => setSelectedFood(e.target.value)} className="w-full border p-2 text-sm rounded-xs font-serif">
                      {LIUS_MENU.map(item => <option key={item} value={item}>{item}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold mb-1">BV Member Brought (Guest):</label>
                    <input type="text" value={guestName} onChange={(e) => setGuestName(e.target.value)} className="w-full border p-2 text-sm rounded-xs" placeholder="e.g. Sarah Miller" required />
                  </div>
                  <div>
                    <label className="block font-bold mb-1">What Did They Order?</label>
                    <select value={guestFood} onChange={(e) => setGuestFood(e.target.value)} className="w-full border p-2 text-sm rounded-xs font-serif">
                      {LIUS_MENU.map(item => <option key={item} value={item}>{item}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold mb-1">Photo Proof:</label>
                    <input type="file" accept="image/*" onChange={(e) => e.target.files[0] && compressAndSetPhoto(e.target.files[0], setPhotoBase64)} className="w-full text-xs" />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setIsTrackModalOpen(false)} className="w-1/3 py-2 border font-bold">Cancel</button>
                    <button type="submit" className="w-2/3 py-2 bg-[#1C3A27] text-white font-bold">Save Visit Entry</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADMIN PASSCODE MODAL */}
          {isAdminModalOpen && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 font-sans">
              <div className="bg-[#FAF7F2] border-2 border-amber-600 rounded-sm max-w-xs w-full p-6 space-y-4">
                <h3 className="font-bold text-base font-serif">Admin Unlock</h3>
                {passError && <div className="p-2 bg-red-100 text-red-800 text-xs font-bold">{passError}</div>}
                <form onSubmit={handleAdminAuth} className="space-y-3 text-xs">
                  <input type="password" placeholder="Enter code..." value={passcode} onChange={(e) => setPasscode(e.target.value)} className="w-full border p-2 text-sm rounded-xs" autoFocus />
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setIsAdminModalOpen(false)} className="w-1/2 py-2 border font-bold">Cancel</button>
                    <button type="submit" className="w-1/2 py-2 bg-amber-600 text-white font-bold">Unlock</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADMIN EDIT MODAL */}
          {editingVisit && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 font-sans">
              <div className="bg-[#FAF7F2] border-2 border-amber-600 rounded-sm max-w-md w-full p-6 space-y-3 text-xs">
                <h3 className="font-bold text-base font-serif">Edit Entry</h3>
                {editError && <div className="p-2 bg-red-100 text-red-800 font-bold">{editError}</div>}
                <form onSubmit={handleSaveEdit} className="space-y-3">
                  <div><label className="block font-bold">Host:</label><input type="text" value={editHost} onChange={(e) => setEditHost(e.target.value)} className="w-full border p-2 text-sm" /></div>
                  <div><label className="block font-bold">Guest:</label><input type="text" value={editGuest} onChange={(e) => setEditGuest(e.target.value)} className="w-full border p-2 text-sm" /></div>
                  <div><label className="block font-bold">Visit Date (For Late Uploads):</label><input type="date" value={editDate} onChange={(e) => setEditDate(e.target.value)} className="w-full border p-2 text-sm" /></div>
                  <div><label className="block font-bold">Food:</label><select value={editFood} onChange={(e) => setEditFood(e.target.value)} className="w-full border p-2 text-sm font-serif">{LIUS_MENU.map(i => <option key={i} value={i}>{i}</option>)}</select></div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => handleDeleteVisit(editingVisit.id)} className="w-1/3 py-2 bg-red-100 text-red-700 font-bold">Delete</button>
                    <button type="button" onClick={() => setEditingVisit(null)} className="w-1/3 py-2 border font-bold">Cancel</button>
                    <button type="submit" className="w-1/3 py-2 bg-amber-600 text-white font-bold">Save</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MEMBER PROFILE MODAL */}
          {selectedMember && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 font-sans">
              <div className="bg-[#FAF7F2] border-2 border-[#1C3A27] rounded-sm max-w-md w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-xl font-serif">{selectedMember.name}</h3>
                  <button onClick={() => setSelectedMember(null)}><Icon.X className="w-5 h-5" /></button>
                </div>
                <div className="bg-white p-3 rounded-sm border space-y-1">
                  <div className="font-bold border-b pb-1">Score Breakdown</div>
                  <div className="flex justify-between"><span>Visits Logged:</span><span className="font-mono">{selectedMember.visitsLogged} pts</span></div>
                  <div className="flex justify-between text-orange-800"><span>3 Days Streak:</span><span className="font-mono">+{selectedMember.streakBonus} pts</span></div>
                  <div className="flex justify-between text-amber-800"><span>Twice in a Day:</span><span className="font-mono">+{selectedMember.twiceInDayBonus} pts</span></div>
                  <div className="flex justify-between text-emerald-800"><span>Full Menu Bonus:</span><span className="font-mono">+{selectedMember.menuCompletionBonus} pts</span></div>
                  <div className="flex justify-between font-bold border-t pt-1 text-sm"><span>Total Score:</span><span className="font-mono">{selectedMember.totalPoints} PTS</span></div>
                </div>
                <button onClick={() => setSelectedMember(null)} className="w-full py-2 bg-[#1C3A27]/10 font-bold">Close Profile</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
